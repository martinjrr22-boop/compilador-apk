name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL de tu web (con https://)'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Nombre de la app'
        required: true
        default: 'MiApp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crear aplicación Android con Capacitor
        run: |
          mkdir myapp && cd myapp
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inicializar proyecto
          npx cap init "${{ github.event.inputs.app_name }}" "com.app.${{ github.event.inputs.app_name }}" --web-dir "www"
          
          # Crear carpeta web básica requerida por Capacitor
          mkdir www
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=${{ github.event.inputs.app_url }}"></head><body></body></html>' > www/index.html
          
          # Agregar plataforma Android
          npx cap add android

          # Configurar para que cargue tu web en vivo directamente
          node -e "
            const fs = require('fs');
            const file = 'capacitor.config.json';
            let config = JSON.parse(fs.readFileSync(file));
            config.server = { url: '${{ github.event.inputs.app_url }}', cleartext: true };
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          "
          npx cap copy android

      - name: Compilar APK con Gradle
        run: |
          cd myapp/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: myapp/android/app/build/outputs/apk/debug/*.apk
